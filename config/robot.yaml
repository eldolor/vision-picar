# Backend selection for robot/factory.py
# "sim"      -> sim/mock_robot.py (grid-world), no hardware needed
# "teleop"   -> sim/teleop_robot.py, a live phone camera + a human motor --
#               see PLAN-teleop-robot.md. Robot view's "drive via brain"
#               mode pushes frames into this backend.
# "hardware" -> robot/hardware_robot.py (R7): the UGV Rover's ESP32 motor
#               board over serial (ROBOT_SERIAL; SIM_MOTOR_BOARD=fake in the sim)
mode: sim

# How verbs reach the wheels -- PLAN-ros-alignment.md R4 (3.13).
# "direct" -> the backend executes /action's verbs itself (everything before R4)
# "ros"    -> robot/ros_drive.py turns each verb into velocities, closed on the
#             wheel encoders, and sends them through the ROS container
#             (service/slam/, bridge on :8090): twist_mux ->
#             diff_drive_controller -> picar_sim_hardware -> POST /wheels.
#             The container is then the ONE writer to the wheels.
# ROBOT_DRIVE / ROS_BRIDGE_URL override these, as ROBOT_MODE overrides mode.
drive:
  mode: direct
  bridge_url: http://127.0.0.1:8090

# Grid-world map to load when mode is "sim" (or the fake motor board's sim
# body): starter_house | scaled_house | home_first_floor (sim/maps/). The
# SIM_MAP environment variable overrides it.
sim_map: starter_house

# Read only when mode is "sim". Both blocks default to MockRobot's
# original exact/instant behavior -- see sim/mock_robot.py and
# sim/sensors.py for what each does and why it's opt-in
# (PLAN-sim-hardening.md phases S4 and S5).
sim:
  # Phase S4 -- put time in the loop. When true, a move actually occupies
  # its declared duration instead of returning instantly, which is what
  # lets robot/server.py's watchdog readout climb mid-move instead of
  # only between moves. Off by default so the unit suite and every
  # tests/demo_*.py script stay exactly as fast as they always were --
  # turn this on for a live two-uvicorn run, not for automated tests.
  # (Distinct from brain.tick_interval_s below, which paces the *brain's*
  # polling loop for the same "make it watchable" reason; this is the
  # robot side of the same problem.)
  realtime: false

  # Phase S5 -- sensor realism. Every value here reproduces
  # get_distance()'s pre-S5 behavior exactly (an exact multiple of 30cm,
  # never dropped, never latent) until enabled is set true.
  sensor_noise:
    enabled: false
    stddev_cm: 3.0 # Gaussian jitter added to the true (quantized) distance
    dropout_rate: 0.0 # fraction of reads that fail -- see sim/sensors.py
    # for why a dropout reads as 0.0cm (fail-safe: always trips the veto)
    # rather than as a missing value
    min_range_cm: 2.0 # HC-SR04's real minimum
    max_range_cm: 400.0 # HC-SR04's real maximum
    read_latency_s: 0.0 # only actually slept when sim.realtime is also true
  # R5 (PLAN-ros-alignment.md 3.14) -- encoders that misreport. The robot
  # moves truly; each wheel's REPORTED position is scaled, so odometry (and
  # R4's verbs, which close on the encoders) drift the way a mis-measured
  # wheel radius makes them drift on hardware. Off by default: exact.
  odom_drift:
    enabled: false
    left_scale: 1.0
    right_scale: 1.03

# Read only when mode is "teleop" (PLAN-teleop-robot.md).
teleop:
  # How long get_camera_frame() waits for a frame newer than the last one
  # it returned before raising TeleopStall. Must stay comfortably under
  # brain.tick_timeout_s below (B3.3's generic hung-tick deadline), or
  # that fires first with a less specific message.
  stall_timeout_s: 15.0

# Read only when mode is "hardware" on a REAL board (PLAN-ros-alignment.md
# 3.35). The serial port comes from ROBOT_SERIAL (or a `serial_port:` key
# here).
hardware:
  # Skid steer's effective track over the firmware's 0.172 m (CAD geometric: 0.1745 m): the wheels
  # scrub on every turn, so the body turns less than the geometric track
  # predicts. Direct-mode turns, the odometry heading and the ROS
  # controller's wheel_separation_multiplier all take this one number. Env
  # TRACK_SCRUB wins, and the ROS container reads the same env var at launch:
  # set it for both. Never applied to the fake board (its sim body does not
  # scrub). [PLACEHOLDER] 1.0 until measured on the Rover.
  track_scrub: 1.0
  # 3.90 A: the camera the brain sees (the pan-tilt USB camera), read as a
  # stream by robot/camera_stream.py. A udev name or a V4L2 index; env
  # ROBOT_CAMERA wins. Unset: no camera driver. [PLACEHOLDER] until the
  # Rover's udev names exist (HARDWARE-READINESS.md section 5).
  # camera_device: /dev/picar-camera

# World state -- the map and the robot's pose on it (PLAN-mapping.md N1).
# Read by world/factory.py, which is robot/factory.py's sibling.
#
# This is deliberately a SEPARATE block from `mode` above, because the two
# answer different questions: `mode` picks a body, this picks a world
# model, and a real robot with no mapper is a legitimate combination (it
# is today's only one). See world/interface.py for the body/world line.
#
#   "none" -> NullWorld. No mapper; get_pose() and get_map() say so.
#             The honest setting for `mode: teleop` and for `mode:
#             hardware` until N6 -- a phone on a rig has no map.
#   "sim"  -> sim/mock_world.py. The house as DISCOVERED: a 360-degree
#             ring is cast from wherever the robot stands, so the map
#             fills in as it drives rather than being handed over whole.
#             Requires `mode: sim` -- the map and the body must be two
#             views of ONE GridWorld, and the factory refuses otherwise.
#   "ros"  -> world/ros_world.py, an HTTP client of the SLAM container
#             (R5/R6, built; off by default -- WORLD_MODE=ros)
world:
  mode: sim

# Safety thresholds (used identically in sim and hardware phases --
# see robot/safety.py)
safety:
  min_distance_cm: 20 # ultrasonic/simulated-distance floor before forced STOP
  watchdog_timeout_s: 1.0 # max silence from MacBook before Pi stops motors
  # How far the range sensor sits BEHIND the leading edge of the chassis,
  # subtracted from every measured clearance so min_distance_cm above is
  # bumper-to-obstacle rather than sensor-to-obstacle. 0.0 is correct for
  # a front-mounted ultrasonic and for the sim (a robot that is a point);
  # a deck-centre lidar makes it ~11-14cm, at which point 20cm of reported
  # clearance is 6-9cm of real gap. MEASURE IT on the real chassis --
  # hardware-day pre-flight, same day as robot/safety.py's CHASSIS_WIDTH_CM.
  sensor_to_bumper_cm: 0.0

server:
  # Origins allowed to call robot/server.py's HTTP API (e.g. the web
  # twin). "*" is fine for a server that only ever binds to a local/LAN
  # address; tighten this if the server is ever exposed more broadly.
  allowed_origins:
    - "*"

# The brain (control/brain_server.py). It reaches the robot only over
# HTTP, so this base URL is the whole difference between running the
# brain on the Pi (localhost) and on the MacBook (the Pi's LAN IP) --
# see PLAN-brain-relocation.md.
brain:
  robot_url: http://127.0.0.1:8000

  # Cloud vision service: the Phase S2b Python vision policy's /navigate
  # route, and the one call control/admin_server.py makes (walk replay).
  vision_url: ""

  # policy: "tiered" (PLAN-onboard-perception.md 4.10, phase P2) -- YOLO +
  # CLIP run IN THE BRAIN PROCESS on every frame, for free, and the paid
  # /navigate call goes out only on a trigger. The models are an optional
  # install (requirements-perception.txt) and the mission refuses to start
  # without them, naming the pip command.
  #
  # Blank means brain/perceive.py's own defaults (yoloe-11s-seg.pt and RN50),
  # where the reasoning for each is written down. Name a different file
  # here to try another detector without touching code -- the twin shows
  # whichever name is loaded, which is what makes the swap watchable.
  perception_detector: ""
  perception_clip_model: ""
  # The CLIP margin a crop must beat to count as a sighting. 0 means
  # brain/perceive.py's default (0.05), which is PROVISIONAL: the 2026-09-07
  # corpus run found true positives banding at +0.016..+0.034, i.e. every one
  # of them read "absent". Lower this on a rig walk and read the margins off
  # the twin's panel -- that is how the shippable number gets measured. It is
  # exposed rather than lowered because the corpus it was measured on is the
  # invalid one and the negative column overlaps.
  # MEASURED 2026-09-07 on the first valid rig walk (blue-bottle, camera at
  # floor height, target on the floor): true positives band at +0.025..+0.038
  # and non-target frames top out at +0.004, so 0.02 separates them cleanly
  # with zero false positives. The module default (0.05) detected NONE of
  # them. Left as a config value rather than a new module default because
  # this is one walk and one target -- the old corpus found handbags scoring
  # +0.039 against "red backpack", which 0.02 would admit.
  # The gate is now P(target | crop, texts) -- a softmax over the same CLIP
  # scores. MEASURED across both rig walks (2026-09-07): the raw margin
  # cannot be thresholded consistently because a CLIP similarity is not
  # comparable across text queries. Margin 0.05 gave the bottle 0/18; margin
  # 0.02 gave the backpack false positives. Under the softmax, P >= 0.8
  # gives 18/18 (bottle) and 25/31 (backpack). 0 uses the module default.
  perception_match_probability: 0.0
  # Override, for sweeping the raw margin on a new corpus. 0 = use P above.
  perception_match_margin: 0.0
  # "auto" is PLAN-onboard-perception.md 4.2's rule (the target's COCO word
  # picks the path). The same walk measured it losing 11 of 18 true positives:
  # at close range YOLO relabels the bottle as a `vase`, and the label gate
  # discards exactly the frames where the target fills the view. Set this to
  # "low_confidence" to force the open-vocabulary path, which recovered
  # 18/18 with no false positives on that walk.
  # "" uses brain/perceive.py's default, which is now the OPEN-VOCABULARY
  # path: both rig walks measured 4.2's label gate ("auto") losing most of
  # the true positives, because at close range YOLO relabels the object.
  # Set "auto" for 4.2's original rule or "label_gate" to force it. With the
  # shipped text-prompted YOLOE (every box labelled with the whole target
  # text) "auto" gates only a target that is its COCO word, and "label_gate"
  # is refused at start for any other (3.76 L1).
  perception_crop_path: ""
  # 4.2's class-agnostic crop source: anything that is not floor, stands on
  # the floor, and does not reach the top of the frame. UNIONED with the
  # detector's boxes, never a replacement -- measured on the three-walk
  # corpus, detector alone is 86% recall, the mask alone 59%, both 94%.
  # It recovers the close-ups the detector cannot propose on at all.
  # Off by default: a third model per frame, and 2.9's budget says
  # segmentation must not run at the detector's rate on the real part.
  # **OFF since 2026-09-20 (P24).** The 86% -> 94% above was measured with
  # YOLO11s on the three-walk corpus. On all 1234 labelled frames and the
  # shipped YOLOE detector the mask LOSES on 9 of 11 checkpoints, costs
  # `yoloe-11s` 15 points at a 3-FP budget, and costs 836ms against 139 --
  # six times the whole tier for negative value. It helps only the two
  # weakest detectors in the family, which is what P16 meant by "it rescues
  # a destroyed one": a floor, never a contribution. Turn it back on only
  # beside a detector measured to need it.
  perception_floor_mask: false
  # Section 6.1's hysteresis: how many consecutive frames must agree before
  # an edge is believed. 1 reproduces the naive trigger count (2.8x saving),
  # 2 is the measured 4.1x. This is not a tuning knob -- it is what makes
  # trigger discipline work at all, because target_visible flips on 24% of
  # frames.
  tier_consecutive_frames: 2
  # 3.90 A: and, when frames carry capture stamps (the car's camera stream,
  # the phone), the run must also span this many seconds -- today's two
  # frames at the 0.25 s tick -- so a faster camera does not shorten it (R1c).
  # 0: counted only. The simulator's frames are not stamped: counted as before.
  # Arrival's own span is brain/arrival.py's ARRIVAL_SPAN_S (0.25 s), not this
  # key; the band, out-of-vocabulary and cold-search counts stay in frames.
  tier_sighting_span_s: 0.25
  # 3.90 E: "combine frames": candidate_sighting on k detected of the last n
  # frames perception took ("2of3", "3of5") instead of tier_consecutive_frames
  # in a row. "off" (shipped) is today's rule. Per mission: /mission/start's
  # frame_vote. A switch for comparing walks; adoption waits on 3.90 C.
  tier_frame_vote: "off"
  # How many consecutive "absent" frames before asking the cloud whether the
  # target is even in this room. Without it a target outside COCO's 80 never
  # fires anything at all. The number is a guess; tune it on a real walk.
  # MEASURED 2026-09-12 and deliberately LEFT AT 6. With tier_async_cloud
  # on, intervals of 2, 3, 4 and 6 all cover 14 of 15 spans at a median
  # look-latency of 1.0 frame -- so dropping to 2 costs 41 more calls for
  # zero additional coverage. Past about 9 the staleness floor becomes the
  # binding rule instead, which is 6.1's finding arriving from the other
  # side, so the useful range of this number is 2..9.
  # Counted (like the staleness and distance bars) from when the last cloud
  # answer LANDED, since 3.76 -- a slow call no longer leaves a bar already
  # passed for the next frame (the user, 2026-10-13). Not consecutive: a
  # detected frame does not reset it, as when the 6 was measured.
  tier_cold_search_after: 6
  # 3.80.P (the user, 2026-10-17): the pace instead, when a local VLM tier is
  # configured (tier_local_vlm_url). Its questions are free, and on the
  # Jetson one on every free frame kept perception's p90 at 171 ms (budget
  # 250) and MemAvailable >= 823 MB; in the simulator it reached the target
  # in 17 of 21 houses with perception blind (6: 12 of 21, 3.80.O). A
  # cloud-only mission keeps tier_cold_search_after. Env
  # TIER_LOCAL_COLD_SEARCH_AFTER overrides.
  tier_local_cold_search_after: 1

  # Phase C. How much NEW GROUND (centimetres) may be covered before the
  # cloud is asked to look again while the local tier is seeing nothing.
  # Fires as an OR beside the frame count above, never instead of it: a
  # pivot covers no ground, so on distance alone a robot scanning in place
  # would never re-trigger.
  #
  # 0 disables it, which is the shipped setting until a walk measures a
  # number. NOTE this needs odometry, and the only real-pixels backend
  # this project has -- a phone on a wheeled rig -- has none, so on those
  # walks it falls back to the frame count and says so on the panel.
  tier_cold_search_after_cm: 0

  # Phase A. Dispatch the deliberation call instead of blocking the tick
  # on it, and hold the last cloud goal while one is outstanding rather
  # than scanning. 2.5 has specified this since the tiered architecture
  # was written; the code blocked until 2026-09-12.
  #
  # OFF until measured: it changes what the robot does on a free frame.
  # MEASURED 2026-09-12 and turned ON -- evaluations/gpu/pacing/. Over all
  # 8 labelled walks, at this same interval of 6: 14 of 15 visible spans
  # got a look against 12, with FEWER calls (94 vs 100) and half the
  # worst-case latency (2 frames vs 4). No operating point favoured the
  # blocking version at anything.
  tier_async_cloud: true

  # Phase F, from five rig walks on 2026-09-12. Every one was dominated by
  # RIGHT (69-107 turns of ~120 actions), and on the one walk where BOTH
  # tiers saw the target -- perception 15 frames, cloud 30 -- it still did
  # not converge. The stand-in scanned on every free frame, which at
  # cold_search 6 is five frames in six, so it outvoted the cloud 5:1.
  # Now it keeps doing what the cloud last said. 2.5's own text.
  tier_hold_goal: true

  # And a floor under that: after this many QUARTER TURNS' worth of
  # consecutive turning (counted in degrees since R1c: 8 = 720 degrees) with
  # the target not detected, emit one FORWARD. A held RIGHT repeated forever
  # is the same spin by another route. 0 disables. The collar still owns
  # safety -- a FORWARD it refuses is the correct outcome, not a bug.
  tier_spin_guard_after: 8

  # Phase G. Whoever can SEE the target, steers. Measured on the newest
  # rig walk: on the 37 frames the local tier called the basket DETECTED,
  # the robot went RIGHT 28 and FORWARD 4 -- the bearing was reported and
  # never steered. This is 1.11's split honoured: on-board says WHERE
  # (it has a bearing, the cloud does not), the cloud says WHAT.
  #
  # It also removes the need to pick a "give up on local after N frames"
  # threshold: with no local bearing there is nothing to steer on, so the
  # cloud is already driving.
  tier_steer_on_sight: true
  # P25 / P7c item 2 -- dead-reckon the bearing to an anchored sighting on
  # frames the detector misses, rather than falling back to a cloud goal
  # several seconds and several turns old. OFF until a walk shows it helps:
  # the problem is measured (median_command_run == 1 on three of six rig
  # walks), the cure is not. Turn it on, walk it, read that metric.
  tier_hold_bearing: false
  # Metres of travel before an anchor is dropped. A monocular sighting has
  # no range, so a DIRECTION is held -- exact under rotation, wrong under
  # translation -- which makes the bound a distance, not a timeout.
  tier_hold_bearing_max_m: 1.0

  # One metrics row per mission, to the walks service (which owns the
  # storage). Empty disables it. The shipper can never fail a mission --
  # see control/metrics_client.py.
  metrics_url: ""
  metrics_secret: ""
  # 2.4's staleness trigger, and a floor under the call rate rather than a
  # metronome -- any real event resets it. Added 2026-09-07 after both rig
  # walks stopped finishing once perception got good: candidate_sighting
  # fires on the EDGE into detected and cold_search needs a run of absent,
  # so a robot that can SEE its target asks the cloud once and never again.
  # 6.1 measured this timer contributing 5.7% of triggers at 8, so the floor
  # is cheap. 0 disables it.
  tier_stale_after: 8
  # Hard cap on paid deliberation calls per mission. 0 is no cap -- the time limit
  # still bounds the mission, but under this policy most steps cost nothing,
  # so the step budget is a poor proxy for the bill.
  tier_max_calls: 0
  # 1.11a: the local probability at which the on-board tier is taken to
  # CORROBORATE a sighting the cloud has already claimed -- a lower bar than
  # the 0.8 needed to claim one alone, because the VLM has already
  # contributed evidence. Measured on the 209-frame search walk: at 0.8 it
  # keeps 2 of 10 true sightings, at 0.5 it keeps 8 and still rejects 34 of
  # 34 storage-bin claims.
  #
  # **REPORTED, NOT ENFORCED.** Nothing acts on the verdict: it appears on
  # the Remote brain panel and in walk data so the next walks measure it,
  # and 1.11a wants two more searches on out-of-vocabulary targets before
  # the behaviour changes. The falsifier is real -- a target the local tier
  # cannot see makes every sighting `unclear`, and the robot would steer
  # forever without committing.
  tier_corroboration_bar: 0.5
  # 3.80.C -- the local VLM tier at arrival: service/local_vlm on the Jetson
  # (http://127.0.0.1:8005). Empty is off: the cloud alone confirms. Env
  # LOCAL_VLM_URL overrides. A local score <= no_below refuses, >= 0.5
  # confirms; max_unable undecided answers in one arrival go to the cloud
  # (thresholds approved by the user 2026-10-14).
  tier_local_vlm_url: ""
  tier_local_no_below: 0.1
  tier_local_max_unable: 2
  tier_local_timeout_s: 3.0
  # 3.94.D -- the tiered policy as a behavior tree: what may be reordered,
  # and its numbers. Empty is today's tree (the defaults live in the code,
  # control/brain_config.py TIER_TREE_DEFAULTS): what_rungs [steer, located,
  # reckoned, candidate, held, scan] (scan last; only reckoned, candidate,
  # held may be left out), absent_events [band, oov, cold_frames,
  # cold_metres], steer_band_deg 3.0 (at most the arrival's 3.0),
  # scan_turn_deg 45 (whole, within the bounds), min_turn_deg 5 and
  # max_turn_deg 90 (whole, at most 90), local_yes_at 0.5 (frame questions,
  # not the arrival). Under tier_search: explore the band and bounds stay at
  # their defaults. The order of who-to-ask, the head of when-to-ask and the
  # arrival are hard rules and have no key.
  tier_tree: {}
  # 3.80.D -- per frame, with the local tier on: a best candidate with CLIP
  # P in [band_low, the 0.8 gate) on tier_consecutive_frames frames asks the
  # local VLM (`uncertain_band`), as do an out-of-vocabulary target and
  # today's four triggers; the cloud only after max_unable unable answers in
  # a row, or when the local VLM is absent (approved by the user 2026-10-14).
  tier_local_band_low: 0.5
  # 3.80.F -- with the local tier on, a search trigger (mission_start,
  # cold_search, staleness) whose sighting answer is not a yes asks the local
  # VLM for a direction (left, right, forward), held as a cloud goal is
  # (the user, 2026-10-16). Off: criterion F4 failed (VE said `forward` on
  # 10 of 10 frames). TIER_LOCAL_DIRECTION overrides.
  tier_local_direction: false
  # 3.80.F -- YOLOE + CLIP steer toward a best crop in the uncertain band
  # while the local VLM is asked about it. On since criterion F5 (the target
  # in view on 26 of 27 such real frames). TIER_STEER_ON_CANDIDATE overrides.
  tier_steer_on_candidate: true
  # 3.91.C (the user, 2026-10-23): a "no" about a candidate perception called
  # the target -- the local VLM's with its box 15-95% of the frame, or the
  # cloud's "not visible" -- is remembered: not steered at, not asked about,
  # until the body moved 0.5 m or turned 30 deg (with odometry), or (a phone)
  # the candidate was lost 3 frames and found again, or 20 s passed. A local
  # no outside the box range cannot tell: the cloud is asked once a candidate
  # run (the tiers' order, the user 2026-10-24: perception < local < cloud).
  tier_remember_no: true
  tier_reject_hold_s: 20.0
  tier_reject_move_m: 0.5
  tier_reject_turn_deg: 30.0
  tier_no_box_range: [0.15, 0.95]
  # 3.80.G -- who chooses where a tiered mission searches: `cloud` (the
  # cloud's direction, as before) or `explore` (explore's nav2 goals; needs
  # nav2 like the explore policy; the tiers decide identity and the last
  # approach). TIER_SEARCH overrides.
  tier_search: cloud
  # 3.98 -- a tiered arrival on the SIMULATOR's frames is confirmed from its
  # geometry (`geometry`: the nearest object near the centre must be the
  # target, no paid call) or by one real cloud call on the render (`cloud`,
  # for a run that means to test it). Real frames always ask the tiers.
  # SIM_ARRIVAL_CONFIRM overrides.
  sim_arrival_confirm: geometry

  # 3.70 E4: a mission's budget -- a time limit (seconds) and a battery floor
  # (volts, the motor board's `v`). It ends `out_of_budget` at either. The
  # step count is no longer set here: it is a backstop derived from the time
  # limit (limit / 0.5 s x 2). Set by the user 2026-10-12 (3.70): 1200 s,
  # because 900 s of explore never finished home_first_floor; 10.5 V (3.5 V a
  # cell, 3S) until a discharge curve is measured on the Rover. Both are
  # re-measured on the car. 0 switches either off.
  mission_time_limit_s: 1200
  battery_floor_v: 10.5
  # A `vision` mission's paid /navigate calls (one a step); reaching it ends
  # `out_of_budget`. 120 is what the old 120-step cap allowed (the user,
  # 2026-10-12). `tiered` has tier_max_calls. 0 = no cap.
  vision_max_calls: 120
  # 3.70 S1-S2: a survey (job "survey": no target, explore only) has its own
  # time limit, 30 min (proposed: twice 3.45's 900 s), and asks for a room's
  # name every 2 m walked and through every doorway ("spacing"), or once per
  # room of the map's shape ("rooms": fewer calls, worse labels), at most
  # room_label_max_calls times -- on the car each is a paid cloud call. The
  # cap is spacing's sim median (29) x 2, rounded up to the ProcTHOR max
  # (60); reaching it leaves the rest unlabelled, never ends the survey.
  # 0 = no cap.
  survey_time_limit_s: 1800
  room_label_mode: spacing
  room_label_max_calls: 60
  # Who names the rooms: frame (the simulator's own `room`, free; on the car
  # nothing is asked) or cloud (the vision service's /room, Opus 5.5, one
  # paid call an ask). Its timeout is held to half of tick_timeout_s: the
  # ask runs inside the mission's tick.
  room_label_source: frame
  room_label_timeout_s: 15
  # 3.116.B: a find mission names rooms the same way, for the room goal
  # policy (explore_goal_policy: rooms) only: off, frame or cloud (paid).
  # At most find_room_label_max_calls asks (3.116.A: median 5, p90 13).
  find_room_labels: "off"
  find_room_label_max_calls: 20
  # Brain-side pre-check; the robot server re-checks against
  # safety.min_distance_cm above, which is now the same number on purpose.
  # NOT 30.0: that is exactly one grid cell, so with sim.sensor_noise on it
  # vetoes about half of the legal one-cell moves. See
  # control/mission_runner.py's DEFAULT_MIN_DISTANCE_CM for the full note.
  min_distance_cm: 20.0
  request_timeout_s: 10.0

  # Failsafe B3.2 -- the AWS link. A vision call that hangs or errors this
  # many times in a row stops the robot and ends the mission.
  vision_timeout_s: 20.0
  max_vision_failures: 3

  # 3.53 -- a mission that ended `arrived_unconfirmed` (the cloud was down
  # at arrival) asks again once the cloud is back: a free /health probe this
  # often, for at most this long, then ONE paid call on the arrival frame.
  # The answer is recorded beside the outcome, never instead of it. 0 = off.
  reconfirm_probe_s: 15.0
  reconfirm_window_s: 600.0

  # 3.56 -- the arrival confirmation's own deadline, clamped to
  # vision_timeout_s: above the slowest cloud call recorded (6.78 s of 98),
  # so a hanging cloud parks the robot at its target in ~25 s, not a minute.
  arrival_confirm_timeout_s: 8.0
  # 3.56 -- while a cloud-policy mission runs, look at the vision service's
  # free /health this often and report it as status.cloud. 0 = off.
  cloud_probe_s: 15.0
  # 3.65 phase 2 -- explore's next goal: "rule" (hand-written order),
  # "learned" (a linear score trained in simulation, brain/explore_goal_weights.json)
  # or "network" (that plus a small network, brain/explore_goal_net.json);
  # 3.96: "rooms" (seven room features more, brain/explore_goal_rooms.json),
  # the default since 3.125 (the user, 2026-10-31: on 588 test houses without
  # room labels, median goals -14% R / -22% U, finds within 1%).
  explore_goal_policy: rooms
  # 3.88 A -- ask mode: explore pauses at each goal choice for a person's pick
  # among the candidates the rules allow (the Sim tab's map), takes the rule's
  # pick after explore_ask_timeout_s, and records every choice, one file a
  # mission, under explore_choice_dir. Off unless set here or by a mission start.
  explore_ask: false
  explore_ask_timeout_s: 60.0
  explore_choice_dir: recordings/explore-choices
  # 3.99 -- every mission's end, one line each in
  # <intervention_dir>/interventions.jsonl: whether a person stepped in (a Stop,
  # a D-pad takeover) and what it was doing then. Local only, never uploaded;
  # `python -m control.intervention_report` reports interventions per hour.
  intervention_dir: recordings/interventions

  # Replaying a recorded walk, which is NOT a mission and wants a longer
  # deadline: nothing is driving, and replay is the burstiest caller here
  # (several frames at once against one vision task, on the slowest model
  # in the allow-list). Sharing the 20s above cost one 22-frame comparison
  # 21 of its frames to read timeouts.
  replay_timeout_s: 60.0

  # Failsafe B3.3 -- a brain loop that is alive but stuck. A tick that
  # doesn't return in this long stops the robot and ends the mission.
  tick_timeout_s: 30.0
  # Extra pause between steps. 0 runs as fast as the loop allows, which in
  # simulation is far too fast to watch: MockRobot._settle() is a no-op
  # (Phase S4 puts time in the loop), so a whole 61-step mission finishes in
  # about half a second and the twin only ever shows you the result. Pacing
  # it here makes the mission observable, which is the point of running it
  # from the twin at all. On hardware a move takes real seconds and this can
  # go back to 0. The library default (control/brain_config.py) stays 0 so
  # tests are not slowed by a display concern.
  tick_interval_s: 0.25

  # Failsafe drills (control/drills.py): POST /mission/start accepts a
  # `fault` that breaks one thing on purpose, so the twin can show B3.2 and
  # B3.3 firing -- neither can be provoked by pressing anything otherwise.
  # Every drill is fail-safe (it can only end a mission with the robot
  # stopped). Turn this off if the brain is ever reachable beyond the LAN:
  # anyone who can reach it could otherwise end someone else's mission.
  allow_drills: true

  # Recording: the Guide tab's Robot view can save the frames of a walk
  # here, so the same walk can be replayed through the Python brain
  # (sim/replay_robot.py) as many times as you like without walking it
  # again. Written relative to the repo root; .gitignore'd.
  allow_recording: true
  recording_dir: recordings

  # 3.46: every mission's object inventory (labels and map positions, no
  # images) is written under inventory_dir, and uploaded to the private
  # recordings bucket when INVENTORY_BUCKET is set in the environment --
  # service/tunnel/run.sh sets it (decided by the user 2026-10-07).
  inventory_dir: recordings/inventory
  inventory_prefix: inventory
  drill_vision_timeout_s: 2.0 # shortened so a demo takes seconds, not a minute
  drill_tick_timeout_s: 3.0
