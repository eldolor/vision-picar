AWSTemplateFormatVersion: "2010-09-09"
Description: >
  vision-picar admin: control/admin_server.py (view/delete recorded walks)
  as its own ECS Fargate service, sharing the vision-picar-service stack's
  NLB/ALB on port 80 (path-routed) with the twin, vision-analyze, and the
  brain. Deliberately separate from vision-picar-brain -- see control/
  admin_server.py's docstring for why -- with its own ECR repo, IAM roles,
  and secret. Mounts the same EFS volume as the brain (recordings.yaml),
  read/write, so it can review and prune whatever the brain has captured.

Parameters:
  NetworkStackName:
    Type: String
    Default: vision-picar-network
  ServiceStackName:
    Type: String
    Default: vision-picar-service
  RecordingsStackName:
    Type: String
    Default: vision-picar-recordings
  ContainerImageTag:
    Type: String
    Default: latest
  ContainerPort:
    Type: Number
    Default: 8002
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
    Description: >
      Same bootstrap knob as brain.yaml: deploy once with 0 (creates the ECR
      repo with nothing to launch yet), push the image, redeploy with 1.
  VisionSecretArn:
    Type: String
    Default: ""
    Description: >
      Full ARN of vision-picar-app-shared-secret, so replay can authenticate
      to the vision service's /navigate. Exact ARN including the suffix, not
      a wildcard or a bare name: ECS's Secrets Manager authorization check
      runs against the literal SecretId string before any name resolution
      (the same trap brain.yaml documents). Find it with
      `aws secretsmanager describe-secret --secret-id
      vision-picar-app-shared-secret --query ARN`. Empty disables replay.
  JudgeEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Whether the walk scorecard may call Bedrock to judge sampled frames.
      "false" leaves the free, deterministic metrics tier working on its own
      -- useful if the judge's per-walk cost is ever unwelcome.
  JudgeModelId:
    Type: String
    Default: us.anthropic.claude-opus-4-5-20251101-v1:0
    Description: >
      The judge model. Opus 4.5 by default: replaying walk
      red-backpack-20260829-195904 through every invokable vision model on
      this account, it was the only one that both made forward progress and
      stayed obstacle-aware, and the only one that refused to call a red
      blanket a red backpack -- which is the one quality a judge needs.
  JudgeSampleFrames:
    Type: String
    Default: "8"
    Description: >
      How many evenly spaced frames of a walk the judge looks at (first and
      last always included). One Bedrock call each, so this is the knob that
      sets a walk's evaluation cost.

Conditions:
  HasVisionSecret: !Not [!Equals [!Ref VisionSecretArn, ""]]

Resources:
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vision-picar-admin
      ImageScanningConfiguration:
        ScanOnPush: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vision-picar-admin
      RetentionInDays: 14

  AppSharedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: vision-picar-admin-shared-secret
      Description: >
        Shared secret control/admin.html must send as the x-app-secret
        header. Deliberately independent from the brain's and twin's
        secrets -- reviewing/deleting recordings is a different privilege
        than starting a mission, and the services are independently
        deployed. Placeholder at creation -- real value set via `aws
        secretsmanager put-secret-value` after deploy, never in this
        template.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: placeholder
        ExcludePunctuation: true
        PasswordLength: 32

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vision-picar-admin-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadOwnSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSharedSecret
                  # The vision service's secret too, injected as
                  # VISION_SHARED_SECRET so replay can call its /navigate.
                  - !If [HasVisionSecret, !Ref VisionSecretArn, !Ref AppSharedSecret]

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vision-picar-admin-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Beyond the EFS mount, the only permission here is Bedrock, for the
      # walk scorecard's judge tier (control/walk_eval.py). This process
      # still never calls the robot or the vision service -- Bedrock is a
      # managed endpoint reached over the VPC's existing bedrock-runtime
      # interface endpoint, not a peer service in this project, so admin
      # keeps the property its docstring cares about: reviewing recordings
      # does not depend on where the brain or the robot is running today.
      # Routing the judge through service/vision_analyze instead would have
      # broken exactly that, and would have meant shipping frames already on
      # this task's own volume out over HTTP to be read back.
      Policies:
        - PolicyName: MountRecordingsVolume
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !ImportValue
                  Fn::Sub: "${RecordingsStackName}-EfsFileSystemArn"
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !ImportValue
                      Fn::Sub: "${RecordingsStackName}-EfsAccessPointArn"
        - PolicyName: JudgeRecordedWalks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Resource "*" matches service.yaml's own Bedrock policy, and
              # for the same reason: cross-region inference profiles resolve
              # to model ARNs in several regions, which a narrower resource
              # list gets wrong the moment the judge model changes.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Converse
                Resource: "*"

  AdminSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Admin ECS Fargate task -- inbound only from the shared internal ALB
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "${ServiceStackName}-AlbSecurityGroupId"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: vision-picar-admin-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # All of this service's paths in one rule -- 3 of the 5-value
  # path-pattern limit, unlike brain.yaml which needed two rules.
  AlbListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-AlbListenerArn"
      Priority: 30
      Conditions:
        - Field: path-pattern
          Values:
            - /admin
            # control/admin.js -- the console's client, previously inline in
            # admin.html. A missing path here means the page loads and does
            # nothing at all, since it would fall through to vision-analyze.
            - /admin.js
            - /recording/walks*
            - /stats
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # An ALB ListenerRule condition allows at most 5 path-pattern values and the
  # rule above uses four, so the read-only /recording/* routes that are not
  # under /recording/walks get their own. Same split twin.yaml and
  # teleop-brain.yaml already make.
  #
  # A route added here without a path added there is a 404 that looks like a
  # bug in the page -- it has happened four times now, which is why
  # tests/test_alb_routes.py asserts the two stay in step.
  AlbListenerRuleReadonly:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-AlbListenerArn"
      Priority: 31
      Conditions:
        - Field: path-pattern
          Values:
            # The replay model picker's source -- admin relays the vision
            # service's allow-list rather than the console carrying a copy.
            - /recording/models
            # The per-model comparison table.
            - /recording/summary
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vision-picar-admin
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      Volumes:
        - Name: recordings
          EFSVolumeConfiguration:
            FilesystemId: !ImportValue
              Fn::Sub: "${RecordingsStackName}-EfsFileSystemId"
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !ImportValue
                Fn::Sub: "${RecordingsStackName}-EfsAccessPointId"
              IAM: ENABLED
      ContainerDefinitions:
        - Name: admin
          Image: !Sub "${EcrRepo.RepositoryUri}:${ContainerImageTag}"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          MountPoints:
            - SourceVolume: recordings
              ContainerPath: /app/recordings
              ReadOnly: false
          Environment:
            # The walk scorecard's judge tier. Off unless explicitly enabled,
            # so the deterministic metrics (which cost nothing and call
            # nothing) stay the default behaviour.
            - Name: WALK_JUDGE_ENABLED
              Value: !Ref JudgeEnabled
            - Name: BEDROCK_JUDGE_MODEL_ID
              Value: !Ref JudgeModelId
            - Name: JUDGE_SAMPLE_FRAMES
              Value: !Ref JudgeSampleFrames
            # Where replay re-asks a walk's frames. The INTERNAL ALB, same
            # reasoning as brain.yaml's VISION_URL: the private subnets have
            # no route to the internet, so the public NLB name is unreachable
            # from in here.
            - Name: VISION_URL
              Value: !Sub
                - "http://${AlbDns}"
                - AlbDns: !ImportValue
                    Fn::Sub: "${ServiceStackName}-InternalAlbDnsName"
          Secrets:
            - Name: APP_SHARED_SECRET
              ValueFrom: !Ref AppSharedSecret
            # The vision service's OWN secret, not this service's -- replay
            # is an outbound call and has to present what that service
            # expects (same distinction brain.yaml draws).
            - !If
              - HasVisionSecret
              - Name: VISION_SHARED_SECRET
                ValueFrom: !Ref VisionSecretArn
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: admin

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbListenerRule
    Properties:
      ServiceName: vision-picar-admin-service
      Cluster: !ImportValue
        Fn::Sub: "${ServiceStackName}-EcsClusterName"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetAId"
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetBId"
          SecurityGroups:
            - !Ref AdminSecurityGroup
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: admin
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref AlbTargetGroup

Outputs:
  PublicUrlNote:
    Value: !Sub
      - "http://${NlbDnsName}/admin"
      - NlbDnsName:
          Fn::ImportValue: !Sub "${ServiceStackName}-NlbDnsName"
  EcrRepositoryUri:
    Value: !GetAtt EcrRepo.RepositoryUri
  AppSharedSecretArn:
    Value: !Ref AppSharedSecret
