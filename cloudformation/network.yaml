AWSTemplateFormatVersion: "2010-09-09"
Description: >
  vision-picar networking: 1 VPC across 2 AZs (ALB requires subnets in at
  least 2 AZs -- a hard AWS requirement). 2 public subnets (internet-facing
  NLB lives here) + 2 private subnets (internal ALB and ECS Fargate tasks
  live here). No NAT Gateway -- the private subnets have no internet route
  at all; everything the ECS tasks need (ECR, CloudWatch Logs, Secrets
  Manager, Bedrock) is reached via VPC endpoints instead, so the tasks that
  call Claude (via Amazon Bedrock) never touch the public internet.

Parameters:
  # Interface endpoints are billed per endpoint PER AZ per hour, so putting
  # all five in both private subnets doubles their cost -- about $73/month
  # at list against $36 in one AZ, which was the single largest line on the
  # August 2026 bill. They do not need to be in every subnet: private DNS
  # resolves to whichever ENI exists, and cross-AZ traffic inside a VPC is
  # ordinary (~$0.01/GB, and the S3 gateway endpoint below already keeps
  # the bulky ECR layer pulls off that path entirely).
  #
  # What "false" costs: if that one AZ has trouble, tasks in the other lose
  # ECR, Logs, Secrets Manager and Bedrock. For this project that is the
  # right trade; flip to "true" before anything depends on surviving an AZ.
  #
  # NOTE this is unrelated to the ALB, which REQUIRES two AZs and keeps
  # both its subnets -- ALB/NLB hours are billed per load balancer, not per
  # AZ, so nothing would be saved by narrowing those anyway.
  EndpointHighAvailability:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Put interface endpoints in both AZs (about 2x the cost) rather than one.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.0.2.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.3.0/24

Conditions:
  EndpointsInBothAzs: !Equals [!Ref EndpointHighAvailability, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: vision-picar-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: vision-picar-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: vision-picar-public-subnet-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: vision-picar-public-subnet-b

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: vision-picar-private-subnet-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: vision-picar-private-subnet-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: vision-picar-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Shared by both private subnets. No default route -- these subnets have
  # no path to the internet at all, on purpose. Only the S3 gateway
  # endpoint route (added below) touches this table.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: vision-picar-private-rt

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # --- VPC endpoints: replace the NAT Gateway's job for the specific AWS
  # services the ECS task needs (ECR image pull, CloudWatch Logs, Secrets
  # Manager, Bedrock), with zero internet egress from the private subnets.
  #
  # **The usual "endpoints are cheaper than a NAT Gateway" rule does not
  # survive five endpoints, and zero egress is the real reason to keep
  # them.** One NAT Gateway is ~$33/month; five interface endpoints are
  # ~$73 across two AZs and ~$36 across one -- so on price alone a NAT wins
  # outright today and roughly ties after the single-AZ default above. What
  # a NAT would also do is give every task here unrestricted outbound
  # internet, and PrivateRouteTable has no default route on purpose (see
  # its own comment). That containment is worth more than the few dollars
  # between the two.
  #
  # Revisit if something inside the VPC ever needs a host with NO interface
  # endpoint -- pulling model weights at runtime, a non-AWS API. That is a
  # real reason for a NAT. Cost is not.
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from inside the VPC to interface endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !If
        - EndpointsInBothAzs
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !If
        - EndpointsInBothAzs
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !If
        - EndpointsInBothAzs
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !If
        - EndpointsInBothAzs
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]

  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-runtime"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !If
        - EndpointsInBothAzs
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - [!Ref PrivateSubnetA]
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  VpcCidr:
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"
  PublicSubnetAId:
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetAId"
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetBId"
  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetAId"
  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetBId"
