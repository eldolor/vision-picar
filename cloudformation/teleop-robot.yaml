AWSTemplateFormatVersion: "2010-09-09"
Description: >
  vision-picar teleop robot: a second robot/server.py ECS Fargate service,
  same image and code as vision-picar-twin but running mode: teleop
  (ROBOT_MODE env var -- see robot/factory.py) instead of mode: sim, so a
  live phone can drive a real MissionRunner mission at the same time the
  Sim tab's mode: sim twin keeps working. Sibling of twin.yaml, not a
  replacement for it: separate ECR repo, IAM roles, secret and ECS
  service, sharing only the vision-picar-service stack's NLB/ALB/cluster
  and the vision-picar-service stack's CloudFront distribution in front of
  it -- routed by its own path prefix (ROUTE_PREFIX env var -- see
  robot/server.py) rather than a second load balancer, since robot/server.py's
  literal, unprefixed paths (/action, /frame, ...) are already exhaustively
  claimed by twin.yaml's own ListenerRules. See PLAN-teleop-robot.md.

Parameters:
  EnvLabel:
    Type: String
    Default: ""
    Description: >
      Names this deployment in the twin's UI banner (robot/server.py
      exposes it on /health; web-twin/app.js renders it). Empty -- the
      default, and what production uses -- means no banner at all, so the
      same image is safe in every environment and a warning that is always
      on never gets a chance to become invisible. The Lab environment
      passes "Lab".
  NetworkStackName:
    Type: String
    Default: vision-picar-network
  ServiceStackName:
    Type: String
    Default: vision-picar-service
  ContainerImageTag:
    Type: String
    Default: latest
  ContainerPort:
    Type: Number
    Default: 8000
  RoutePrefix:
    Type: String
    Default: /teleop-robot
    Description: >
      Must stay in sync with the literal path-pattern values in
      AlbListenerRule/AlbListenerRulePwa below and with
      AlbTargetGroup's HealthCheckPath -- CloudFormation can't derive a
      path-pattern list from a prefix string, so all three are written out
      by hand and have to agree.
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
    Description: >
      Bootstrap knob, same reason as brain.yaml's: the ECR repo doesn't
      exist until this stack's first deploy, so there's no image to launch
      yet. Deploy once with 0, push the image, then redeploy with 1 (the
      default).

Conditions:
  # An empty EnvLabel must add no environment variable at all, not one
  # with an empty value: the latter still rewrites the task definition,
  # which a change set against the live production stack showed would
  # churn TaskDefinition and EcsService for a deployment that wants
  # nothing to change. AWS::NoValue drops the list element entirely.
  HasEnvLabel: !Not [!Equals [!Ref EnvLabel, ""]]

Resources:
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vision-picar-teleop-robot
      ImageScanningConfiguration:
        ScanOnPush: true
      # Without this every image ever pushed is kept forever, for six
      # repositories -- ECR was $0.92 of a seven-day bill and only grows.
      # Keeps enough history to roll a deploy back (M11), and nothing more.
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules": [{"rulePriority": 1, "description": "Expire untagged images after 7 days -- a redeploy orphans the previous build, and nothing ever pulls an untagged layer set again.", "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7}, "action": {"type": "expire"}}, {"rulePriority": 2, "description": "Keep the 5 most recent tagged images -- enough to roll back a few deploys, which is what M11's rollback needs.", "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5}, "action": {"type": "expire"}}]}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vision-picar-teleop-robot
      RetentionInDays: 14

  AppSharedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: vision-picar-teleop-robot-shared-secret
      Description: >
        Shared secret a phone (and the teleop-brain service) must send as
        the x-app-secret header to reach this robot's movement/sensing/
        /teleop/frame routes. Placeholder at creation -- real value set via
        `aws secretsmanager put-secret-value` after deploy, never in this
        template. Distinct from the sim-mode twin's secret -- these are two
        independent robots.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: placeholder
        ExcludePunctuation: true
        PasswordLength: 32

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vision-picar-teleop-robot-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadOwnSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSharedSecret

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vision-picar-teleop-robot-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # No permissions -- same as twin's task role. TeleopRobot calls no
      # AWS service itself; it just holds whatever frame was last pushed.

  TeleopRobotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Teleop robot ECS Fargate task -- inbound only from the shared internal ALB
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "${ServiceStackName}-AlbSecurityGroupId"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: vision-picar-teleop-robot-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      TargetType: ip
      # Prefixed -- robot/server.py's /health route is itself prefixed by
      # ROUTE_PREFIX below (a target group's own health check bypasses
      # listener routing and hits the container directly, but the
      # container only answers requests under its own prefix).
      HealthCheckPath: /teleop-robot/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Same exhaustive-path-list convention as twin.yaml's two rules, every
  # value carrying this stack's RoutePrefix by hand (an ALB path-pattern
  # condition is a literal list, not a prefix match against a variable) --
  # this is what lets this service and the sim-mode twin share one
  # listener without their path sets ever overlapping. Split across two
  # rules for the same reason twin.yaml is: at most 5 path-pattern values
  # per condition.
  AlbListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-AlbListenerArn"
      Priority: 40
      Conditions:
        - Field: path-pattern
          Values:
            - /teleop-robot/
            - /teleop-robot/action
            - /teleop-robot/stop
            - /teleop-robot/distance
            - /teleop-robot/frame
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  AlbListenerRulePwa:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-AlbListenerArn"
      Priority: 41
      Conditions:
        - Field: path-pattern
          Values:
            - /teleop-robot/teleop/frame
            - /teleop-robot/manifest.json
            - /teleop-robot/icons/*
            - /teleop-robot/health
            # The twin's client script, which this deployment serves at its
            # own prefix. Missing since the JS was extracted out of
            # index.html: the page loaded and did nothing, because a page
            # whose script 404s still renders. Found by
            # tests/test_alb_routes.py, not by anyone looking at it.
            - /teleop-robot/app.js
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # A third rule, because both of the above are at the 5-path-pattern-value
  # limit. robot/server.py is deployed twice and every route it gains has to
  # be routed at both prefixes -- tests/test_alb_routes.py fails if one is
  # forgotten, which is the only reason /teleop-robot/app.js above was ever
  # found.
  AlbListenerRuleDepth:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-AlbListenerArn"
      Priority: 42
      Conditions:
        - Field: path-pattern
          Values:
            # The depth grid (phase M2). Under mode: teleop this answers
            # all-unusable -- a live phone walk has no ToF -- which is a
            # real answer and has to be reachable to be read as one.
            - /teleop-robot/depth
            # Odometry (phase B). Under mode: teleop this answers
            # `usable: false` -- a phone on a wheeled rig has no encoders
            # -- which is a real answer and has to be reachable to be read
            # as one. Same argument as /depth directly above.
            - /teleop-robot/odometry
            # The world model (N1). Under mode: teleop this answers
            # `usable: false` on both -- world/factory.py ships `none`
            # for a robot with no grid world, and a phone on a rig has
            # no map. Same argument as the two above: a real answer has
            # to be reachable to be read as one, and the alternative is
            # a 404 that reads as "this deployment is broken" rather
            # than "this robot cannot map".
            - /teleop-robot/world/pose
            - /teleop-robot/world/map
            # R2. A phone has no encoders; `usable: false`, reachable.
            - /teleop-robot/wheels
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # R2's other two, on their own rule because rule 42 is full. Under
  # mode: teleop both answer `usable: false` -- a phone has no lidar and
  # nothing but a simulator knows the truth -- which is a real answer and
  # has to be reachable to be read as one.
  AlbListenerRuleTeleopR2:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-AlbListenerArn"
      Priority: 43
      Conditions:
        - Field: path-pattern
          Values:
            - /teleop-robot/scan
            - /teleop-robot/world/truth
            - /teleop-robot/world/error
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vision-picar-teleop-robot
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: teleop-robot
          Image: !Sub "${EcrRepo.RepositoryUri}:${ContainerImageTag}"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: ALLOWED_ORIGINS
              Value: "*"
            - !If
              - HasEnvLabel
              - Name: ENV_LABEL
                Value: !Ref EnvLabel
              - !Ref AWS::NoValue
            # robot/factory.py: picks sim/teleop_robot.py's TeleopRobot
            # instead of config/robot.yaml's own mode: sim default --
            # same image as the twin, different runtime choice.
            - Name: ROBOT_MODE
              Value: teleop
            # world/factory.py. config/robot.yaml ships `world: sim`
            # because it ships `mode: sim`, and the two must move
            # together: the sim world model maps a GridWorld, and this
            # deployment's robot is a phone. Without this the factory
            # refuses at start-up -- BY DESIGN, because the alternative
            # is a plausible-looking map of a house the robot is not in.
            # `none` is the honest setting: a phone on a wheeled rig has
            # no map, and both /world routes say so.
            - Name: WORLD_MODE
              Value: none
            # robot/server.py: every route answers under this prefix
            # instead of bare, so it can share the twin's listener --
            # must match RoutePrefix and the ListenerRule values above.
            - Name: ROUTE_PREFIX
              Value: !Ref RoutePrefix
          Secrets:
            - Name: APP_SHARED_SECRET
              ValueFrom: !Ref AppSharedSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: teleop-robot

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbListenerRule
    Properties:
      ServiceName: vision-picar-teleop-robot-service
      Cluster: !ImportValue
        Fn::Sub: "${ServiceStackName}-EcsClusterName"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetAId"
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetBId"
          SecurityGroups:
            - !Ref TeleopRobotSecurityGroup
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: teleop-robot
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref AlbTargetGroup

Outputs:
  PublicUrlNote:
    Description: >
      Same NLB/CloudFront as vision-picar-service and vision-picar-twin,
      routed by path prefix. Load this from a phone over the CloudFront
      HTTPS domain (cdn.yaml's DistributionDomainName), not this bare NLB
      URL -- getUserMedia needs a secure context. Point Settings' "Robot
      server URL" at the same base, e.g.
      https://<cloudfront-domain>/teleop-robot.
    Value: !Sub
      - "http://${NlbDnsName}${RoutePrefix}/"
      - NlbDnsName:
          Fn::ImportValue: !Sub "${ServiceStackName}-NlbDnsName"
        RoutePrefix: !Ref RoutePrefix
  EcrRepositoryUri:
    Value: !GetAtt EcrRepo.RepositoryUri
  AppSharedSecretArn:
    Value: !Ref AppSharedSecret
