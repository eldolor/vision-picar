AWSTemplateFormatVersion: "2010-09-09"
Description: >
  vision-picar digital twin: robot/server.py + web-twin/index.html as an
  ECS Fargate service, sharing the vision-picar-service stack's NLB and
  internal ALB on the same port 80 as the vision-analyze service, routed
  by path (this stack's own paths -- /, /action, /stop, /distance,
  /frame -- via a ListenerRule on the service stack's shared listener)
  rather than a second port or a second pair of load balancers. Separate
  ECR repo, IAM roles, and secret from the vision-analyze service --
  "separate app," same cluster, same public port.

Parameters:
  NetworkStackName:
    Type: String
    Default: vision-picar-network
  ServiceStackName:
    Type: String
    Default: vision-picar-service
  ContainerImageTag:
    Type: String
    Default: latest
  ContainerPort:
    Type: Number
    Default: 8000

Resources:
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vision-picar-twin
      ImageScanningConfiguration:
        ScanOnPush: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vision-picar-twin
      RetentionInDays: 14

  AppSharedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: vision-picar-twin-shared-secret
      Description: >
        Shared secret the web twin must send as the x-app-secret header
        to reach robot/server.py's movement/sensing routes. Placeholder
        at creation -- real value set via `aws secretsmanager
        put-secret-value` after deploy, never in this template.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: placeholder
        ExcludePunctuation: true
        PasswordLength: 32

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vision-picar-twin-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadOwnSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSharedSecret

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vision-picar-twin-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # No permissions -- this app (the sim + static UI) calls no AWS
      # services itself.

  TwinSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Twin ECS Fargate task -- inbound only from the shared internal ALB
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "${ServiceStackName}-AlbSecurityGroupId"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: vision-picar-twin-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Routes this stack's own paths, on the vision-picar-service stack's
  # shared port-80 listener, to this service's target group -- everything
  # else on that listener falls through to its DefaultActions (the
  # vision-analyze target group). robot/server.py's full route set (see
  # its @app.get/@app.post decorators) is exactly these paths, so listing
  # them exhaustively here is exact, not a guess. Split across two rules
  # because an ALB ListenerRule condition allows at most 5 path-pattern
  # values -- both point at the same target group, priority order between
  # them doesn't matter since their path sets don't overlap.
  AlbListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-AlbListenerArn"
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /
            - /action
            - /stop
            - /distance
            - /frame
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # PWA "Add to Home Screen" support (without a rule for these, they'd 404
  # by falling through to vision-analyze, which has no such routes), plus
  # /health: without this, a public GET /health silently answers with
  # vision-analyze's health instead of the twin's own (its target group's
  # health check bypasses listener routing entirely and was never affected
  # by this; only a caller hitting the public path was) -- the twin's
  # web-twin/index.html watchdog readout is exactly such a caller, and
  # reported "unreachable" as a result. Kept in this rule rather than a
  # third one: still well under the 5-path-pattern-values limit per rule.
  AlbListenerRulePwa:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-AlbListenerArn"
      Priority: 11
      Conditions:
        - Field: path-pattern
          Values:
            - /manifest.json
            - /icons/*
            - /health
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vision-picar-twin
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: twin
          Image: !Sub "${EcrRepo.RepositoryUri}:${ContainerImageTag}"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: ALLOWED_ORIGINS
              Value: "*"
          Secrets:
            - Name: APP_SHARED_SECRET
              ValueFrom: !Ref AppSharedSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: twin

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbListenerRule
    Properties:
      ServiceName: vision-picar-twin-service
      Cluster: !ImportValue
        Fn::Sub: "${ServiceStackName}-EcsClusterName"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetAId"
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetBId"
          SecurityGroups:
            - !Ref TwinSecurityGroup
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: twin
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref AlbTargetGroup

Outputs:
  PublicUrlNote:
    Description: >
      Same NLB and port as vision-picar-service -- routed by path, not
      port. See that stack's NlbDnsName output.
    Value: !Sub
      - "http://${NlbDnsName}/"
      - NlbDnsName:
          Fn::ImportValue: !Sub "${ServiceStackName}-NlbDnsName"
  EcrRepositoryUri:
    Value: !GetAtt EcrRepo.RepositoryUri
  AppSharedSecretArn:
    Value: !Ref AppSharedSecret
