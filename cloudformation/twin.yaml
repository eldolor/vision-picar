AWSTemplateFormatVersion: "2010-09-09"
Description: >
  vision-picar digital twin: robot/server.py + web-twin/index.html as an
  ECS Fargate service, sharing the vision-picar-service stack's NLB and
  internal ALB on a second port (8000) rather than provisioning a second
  pair of load balancers. Separate ECR repo, IAM roles, and secret from
  the vision-analyze service -- "separate app," same cluster.

Parameters:
  NetworkStackName:
    Type: String
    Default: vision-picar-network
  ServiceStackName:
    Type: String
    Default: vision-picar-service
  ContainerImageTag:
    Type: String
    Default: latest
  ContainerPort:
    Type: Number
    Default: 8000

Resources:
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vision-picar-twin
      ImageScanningConfiguration:
        ScanOnPush: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vision-picar-twin
      RetentionInDays: 14

  AppSharedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: vision-picar-twin-shared-secret
      Description: >
        Shared secret the web twin must send as the x-app-secret header
        to reach robot/server.py's movement/sensing routes. Placeholder
        at creation -- real value set via `aws secretsmanager
        put-secret-value` after deploy, never in this template.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: placeholder
        ExcludePunctuation: true
        PasswordLength: 32

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vision-picar-twin-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadOwnSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSharedSecret

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vision-picar-twin-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # No permissions -- this app (the sim + static UI) calls no AWS
      # services itself.

  TwinSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Twin ECS Fargate task -- inbound only from the shared internal ALB
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "${ServiceStackName}-AlbSecurityGroupId"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: vision-picar-twin-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-InternalAlbArn"
      Port: !Ref ContainerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  NlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: AlbListener
    Properties:
      Name: vision-picar-twin-nlb-tg
      Port: !Ref ContainerPort
      Protocol: TCP
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      TargetType: alb
      Targets:
        - Id: !ImportValue
            Fn::Sub: "${ServiceStackName}-InternalAlbArn"
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health

  NlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !ImportValue
        Fn::Sub: "${ServiceStackName}-NlbArn"
      Port: !Ref ContainerPort
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbTargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vision-picar-twin
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: twin
          Image: !Sub "${EcrRepo.RepositoryUri}:${ContainerImageTag}"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: ALLOWED_ORIGINS
              Value: "*"
          Secrets:
            - Name: APP_SHARED_SECRET
              ValueFrom: !Ref AppSharedSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: twin

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      ServiceName: vision-picar-twin-service
      Cluster: !ImportValue
        Fn::Sub: "${ServiceStackName}-EcsClusterName"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetAId"
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetBId"
          SecurityGroups:
            - !Ref TwinSecurityGroup
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: twin
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref AlbTargetGroup

Outputs:
  PublicUrlNote:
    Description: >
      Same NLB as vision-picar-service, different port -- see that
      stack's NlbDnsName output and append :8000
    Value: !Sub
      - "http://${NlbDnsName}:${ContainerPort}/"
      - NlbDnsName:
          Fn::ImportValue: !Sub "${ServiceStackName}-NlbDnsName"
        ContainerPort: !Ref ContainerPort
  EcrRepositoryUri:
    Value: !GetAtt EcrRepo.RepositoryUri
  AppSharedSecretArn:
    Value: !Ref AppSharedSecret
